name: Bug report
description: A package doesn't work as a drop-in for its Lucide counterpart
labels: ['bug']
body:
  - type: checkboxes
    id: packages
    attributes:
      label: Package
      description: Which packages are affected?
      options:
        - label: filled-lucide
        - label: '@filled-lucide/react'
        - label: '@filled-lucide/vue'
        - label: '@filled-lucide/svelte'
        - label: '@filled-lucide/angular'
        - label: '@filled-lucide/astro'
        - label: '@filled-lucide/solid'
        - label: '@filled-lucide/preact'
        - label: '@filled-lucide/react-native'
        - label: '@filled-lucide/static'
        - label: '@filled-lucide/icons'
        - label: '@filled-lucide/lab'
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
      description: Does the same code work with the upstream Lucide package?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
