name: Release Packages

# Publishes every package to npm at the version in the tag:
#   git tag v1.52.0 && git push origin v1.52.0
# (or create a GitHub release with that tag). Versions follow upstream Lucide.
#
# Authentication is npm trusted publishing (OIDC) — no token needed once each
# package has this repo + release.yml set as its trusted publisher on npmjs.com.
# For the very first publish, before the packages exist, add a short-lived
# granular token as the NPM_TOKEN repository secret, then delete it afterwards.

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Version (e.g. 1.52.0)
        type: string
      tag:
        description: npm dist-tag
        default: 'latest'
        type: choice
        options:
          - latest
          - next
          - beta

permissions: {}

env:
  NPM_TAG: ${{ inputs.tag || 'latest' }}

jobs:
  prepare:
    if: github.repository == 'linus-sch/filled-lucide'
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Get the version
        id: get_version
        run: |
          VERSION="${VERSION_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "Releasing $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          VERSION_REF: ${{ inputs.version || github.ref }}

  release:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      id-token: write # Required for OIDC trusted publishing and provenance
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            'filled-lucide',
            '@filled-lucide/react',
            '@filled-lucide/react-native',
            '@filled-lucide/preact',
            '@filled-lucide/solid',
            '@filled-lucide/angular',
            '@filled-lucide/astro',
            '@filled-lucide/icons',
            '@filled-lucide/svelte',
            '@filled-lucide/vue',
            '@filled-lucide/lab',
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version-file: 'package.json'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set new version
        run: pnpm --filter ${{ matrix.package }} exec npm pkg set version=${{ needs.prepare.outputs.VERSION }}

      - name: Build
        run: pnpm --filter ${{ matrix.package }} build

      - name: Test
        run: pnpm --filter ${{ matrix.package }} run --if-present test

      # Only set for the very first release, before trusted publishing exists.
      - name: Use bootstrap token
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: pnpm --filter ${{ matrix.package }} publish --access public --no-git-checks --ignore-scripts --tag ${{ env.NPM_TAG }}
        env:
          NPM_CONFIG_PROVENANCE: true

  font:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version-file: 'package.json'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Uses upstream Lucide's published code points, so the filled font maps
      # every glyph to the same character as the outline font.
      - name: Create font in ./lucide-font
        run: pnpm build:font

      - name: Upload to artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lucide-font
          path: lucide-font

  static:
    runs-on: ubuntu-latest
    needs: [prepare, font]
    permissions:
      id-token: write # Required for OIDC trusted publishing and provenance
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lucide-font
          path: lucide-font

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version-file: 'package.json'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set new version
        run: pnpm --filter @filled-lucide/static exec npm pkg set version=${{ needs.prepare.outputs.VERSION }}

      - name: Move font
        run: cp -r lucide-font packages/lucide-static/font

      - name: Build
        run: pnpm --filter @filled-lucide/static build

      # Only set for the very first release, before trusted publishing exists.
      - name: Use bootstrap token
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: pnpm --filter @filled-lucide/static publish --access public --no-git-checks --ignore-scripts --tag ${{ env.NPM_TAG }}
        env:
          NPM_CONFIG_PROVENANCE: true

  github-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [prepare, font, release, static]
    permissions:
      contents: write # Required to create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lucide-font
          path: lucide-font

      - name: Zip font and icons
        run: |
          zip -r filled-lucide-font-${{ needs.prepare.outputs.VERSION }}.zip lucide-font
          zip -r filled-lucide-icons-${{ needs.prepare.outputs.VERSION }}.zip icons -i '*.svg'

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            filled-lucide-font-${{ needs.prepare.outputs.VERSION }}.zip
            filled-lucide-icons-${{ needs.prepare.outputs.VERSION }}.zip
