<!doctype html>
<!--
  Source of site/og-image.png, the link preview shown by social networks and
  chat apps. It mirrors the landing page hero. Regenerate with
  tools/build-cdn/assets/render.sh.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        color: #ffffff;
        background: #c43232;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .brand {
        position: absolute;
        top: 56px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 36px;
        font-weight: 500;
      }
      .copy {
        position: absolute;
        top: 196px;
        left: 72px;
      }
      .copy p {
        margin: 0 0 20px;
        color: #f1b4b4;
        font-size: 26px;
        font-weight: 500;
      }
      .copy h1 {
        margin: 0;
        font-size: 72px;
        font-weight: 650;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .icons {
        position: absolute;
        left: 72px;
        bottom: 64px;
        display: flex;
        gap: 30px;
      }
      .icons img {
        width: 40px;
        height: 40px;
        filter: brightness(0) invert(1);
      }
      svg {
        position: absolute;
        inset: 0;
        fill: #f56565;
      }
    </style>
  </head>
  <body>
    <svg
      width="1200"
      height="630"
      viewBox="0 0 1920 1008"
      preserveAspectRatio="none"
    >
      <rect
        x="1825"
        y="0"
        width="95"
        height="348"
      />
      <rect
        x="1791"
        y="348"
        width="129"
        height="441"
      />
      <rect
        x="1841"
        y="789"
        width="79"
        height="219"
      />
    </svg>
    <div class="brand">
      <img
        src="../site/filed-lucide-logo.svg"
        width="42"
        height="42"
        alt=""
      />Filled Lucide
    </div>
    <div class="copy">
      <p>Unofficial community project</p>
      <h1>Beautiful &amp; Filled<br />Lucide Icons</h1>
    </div>
    <div class="icons">
      <img src="../../../icons/house.svg" /><img src="../../../icons/heart.svg" /><img
        src="../../../icons/star.svg"

        src="../../../icons/settings.svg"

</html>
