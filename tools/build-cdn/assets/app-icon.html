<!doctype html>
<!--
  Source of the PNG app icons in site/ (apple-touch-icon, manifest icons,
  favicon.ico). Regenerate with tools/build-cdn/assets/render.sh.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 512px;
        height: 512px;
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      body.transparent {
        background: transparent;
      }
      img {
        width: 320px;
        height: 320px;
      }
      body.transparent img {
        width: 480px;
        height: 480px;
      }
    </style>
  </head>
  <body>
    <img
      src="../site/filed-lucide-logo.svg"
      alt=""
    />
    <script>
      if (location.hash === '#transparent') document.body.className = 'transparent';
    </script>
  </body>
</html>
