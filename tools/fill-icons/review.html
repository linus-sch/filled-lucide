<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filled Lucide — Review</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#f8f9fb;color:#111}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:10}
header h1{margin:0;font-size:16px}
header input{flex:1;min-width:200px;max-width:420px;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px}
.filters{display:flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden}
.filters button{border:0;background:#fff;padding:7px 12px;font:inherit;cursor:pointer;color:#374151}
.filters button+button{border-left:1px solid #d1d5db}
.filters button.on{background:#111;color:#fff}
.meta{color:#6b7280;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px}
.card{position:relative;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;user-select:none}
.card:hover{border-color:#9ca3af}
.card.approved{border-color:#16a34a;background:#f0fdf4}
.card.approved::after{content:'✓';position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:#16a34a;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.card.busy{opacity:.5;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
.box{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.box .icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#f9fafb;border-radius:8px;border:1px solid #f3f4f6}
.box .icon svg{width:32px;height:32px}
.box label{font-size:11px;color:#6b7280;pointer-events:none}
.name{font-size:12px;text-align:center;word-break:break-all;color:#374151}
h2{margin:16px 16px 0;font-size:14px;color:#374151}
body.dragging{cursor:default}
body.dragging .card{pointer-events:none}
.card.selected{border-color:#2563eb;box-shadow:0 0 0 3px #bfdbfe}
.card.approved.selected{border-color:#2563eb}
#marquee{display:none;position:absolute;border:1px solid #3b82f6;background:rgba(59,130,246,.15);z-index:5;pointer-events:none}
#bar{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 8px 8px 14px;border-radius:10px;gap:8px;align-items:center;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#bar button{border:0;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
#bar .approve{background:#16a34a;color:#fff}
#bar .unapprove{background:#fff;color:#111}
#bar .clear{background:transparent;color:#9ca3af}
#error{display:none;z-index:30;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:8px 14px;border-radius:8px}
</style>
</head>
<body>
<header>
  <h1>Filled Lucide — Review</h1>
  <input id="q" placeholder="Search (house, heart, arrow…)">
  <div class="filters" id="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="todo">Not approved</button>
    <button data-f="approved">Approved</button>
  </div>
  <span class="meta" id="meta"></span>
  <span class="meta">Click an icon to approve or unapprove it. Drag a box to select several (hold ⇧ or ⌘ to add to the selection). Approved icons are never regenerated.</span>
</header>
<div id="sections"></div>
<div id="marquee"></div>
<div id="bar">
  <span id="barCount"></span>
  <button class="approve" id="approveSel">Approve</button>
  <button class="unapprove" id="unapproveSel">Unapprove</button>
  <button class="clear" id="clearSel">Clear (esc)</button>
</div>
<div id="error"></div>
<script>
const q = document.getElementById('q');
const sections = document.getElementById('sections');
const meta = document.getElementById('meta');
const errorEl = document.getElementById('error');
let sets = {};
let filter = 'all';
// Selected cards, keyed `set/name`, so a selection survives searching and filtering.
const selected = new Set();
const cards = new Map();

// Icons load as their cards scroll into view, so every icon can be on the page at once.
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    io.unobserve(e.target);
    fetch(e.target.dataset.src, { cache: 'no-store' }).then((r) => r.text()).then((t) => {
      e.target.innerHTML = t;
      const s = e.target.querySelector('svg');
      if (s) { s.setAttribute('width', '32'); s.setAttribute('height', '32'); }
    });
  }
}, { rootMargin: '600px' });

function updateMeta() {
  meta.textContent = Object.values(sets)
    .map((s) => `${s.title}: ${s.approved.size}/${s.names.length} approved`)
    .join(' · ');
}

function render() {
  io.disconnect();
  sections.innerHTML = '';
  cards.clear();
  const term = q.value.trim().toLowerCase();
  for (const [key, set] of Object.entries(sets)) {
    const list = set.names.filter((n) =>
      (!term || n.includes(term)) &&
      (filter === 'all' || (filter === 'approved') === set.approved.has(n)));
    if (!list.length) continue;
    const h = document.createElement('h2');
    h.textContent = `${set.title} (${list.length})`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const n of list) {
      const card = document.createElement('div');
      card.className = 'card' + (set.approved.has(n) ? ' approved' : '') +
        (selected.has(`${key}/${n}`) ? ' selected' : '');
      card.dataset.key = `${key}/${n}`;
      cards.set(card.dataset.key, card);
      card.title = set.approved.has(n) ? 'Approved — click to unapprove' : 'Click to approve';
      card.innerHTML = `<div class="row">
        <div class="box"><div class="icon" data-src="/svg/${key}/filled/${n}.svg"></div><label>Filled</label></div>
        <div class="box"><div class="icon" data-src="/svg/${key}/outline/${n}.svg"></div><label>Outline</label></div>
      </div><div class="name">${n}</div>`;
      card.addEventListener('click', (e) => {
        if (justDragged) return;
        if (e.shiftKey || e.metaKey) return toggleSelected(card.dataset.key);
        approve([`${key}/${n}`], !set.approved.has(n));
      });
      grid.appendChild(card);
    }
    sections.append(h, grid);
  }
  for (const el of sections.querySelectorAll('[data-src]')) io.observe(el);
  updateMeta();
  updateBar();
}

const isApproved = (k) => { const [set, name] = k.split('/'); return sets[set].approved.has(name); };

async function approve(keys, approved) {
  const busy = keys.map((k) => cards.get(k)).filter(Boolean);
  for (const c of busy) c.classList.add('busy');
  try {
    const items = keys.map((k) => { const [set, name] = k.split('/'); return { set, name }; });
    const r = await fetch('/api/approve', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ items, approved }),
    });
    if (!r.ok) throw new Error((await r.json()).error);
    for (const { set, name } of items) {
      approved ? sets[set].approved.add(name) : sets[set].approved.delete(name);
      const card = cards.get(`${set}/${name}`);
      if (!card) continue;
      card.classList.toggle('approved', approved);
      card.title = approved ? 'Approved — click to unapprove' : 'Click to approve';
    }
    updateMeta();
    updateBar();
  } catch (e) {
    errorEl.textContent = `Could not save: ${e.message}`;
    errorEl.style.display = 'block';
    setTimeout(() => (errorEl.style.display = 'none'), 4000);
  } finally {
    for (const c of busy) c.classList.remove('busy');
  }
}

// --- Selection -----------------------------------------------------------

const bar = document.getElementById('bar');
const barCount = document.getElementById('barCount');

function updateBar() {
  const n = selected.size;
  bar.style.display = n ? 'flex' : 'none';
  if (!n) return;
  const done = [...selected].filter(isApproved).length;
  barCount.textContent = `${n} selected · ${done} approved`;
}

function setSelection(keys) {
  for (const k of selected) if (!keys.has(k)) cards.get(k)?.classList.remove('selected');
  for (const k of keys) if (!selected.has(k)) cards.get(k)?.classList.add('selected');
  selected.clear();
  for (const k of keys) selected.add(k);
  updateBar();
}

function toggleSelected(k) {
  const next = new Set(selected);
  next.has(k) ? next.delete(k) : next.add(k);
  setSelection(next);
}

document.getElementById('approveSel').addEventListener('click', () => approve([...selected], true));
document.getElementById('unapproveSel').addEventListener('click', () => approve([...selected], false));
document.getElementById('clearSel').addEventListener('click', () => setSelection(new Set()));

document.addEventListener('keydown', (e) => {
  if (e.target === q) return;
  if (e.key === 'Escape') setSelection(new Set());
  if ((e.metaKey || e.ctrlKey) && e.key === 'a') {
    e.preventDefault();
    setSelection(new Set(cards.keys()));
  }
});

// Rubber-band selection, as in Finder: press anywhere outside the header and
// controls, drag a box, and every card it touches is selected. A press that
// barely moves stays a click, so clicking a card still approves it.
const marquee = document.getElementById('marquee');
let drag = null;
let justDragged = false;

document.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || e.target.closest('header, #bar, #error')) return;
  drag = {
    x: e.pageX, y: e.pageY, clientY: e.clientY, active: false,
    base: e.shiftKey || e.metaKey ? new Set(selected) : new Set(),
    rects: null,
  };
});

function updateDrag() {
  const x = drag.lastX, y = drag.clientY + window.scrollY;
  const left = Math.min(drag.x, x), top = Math.min(drag.y, y);
  const right = Math.max(drag.x, x), bottom = Math.max(drag.y, y);
  Object.assign(marquee.style, {
    display: 'block', left: `${left}px`, top: `${top}px`,
    width: `${right - left}px`, height: `${bottom - top}px`,
  });
  const keys = new Set(drag.base);
  for (const [k, r] of drag.rects) {
    if (r.left < right && r.right > left && r.top < bottom && r.bottom > top) keys.add(k);
  }
  setSelection(keys);
}

document.addEventListener('mousemove', (e) => {
  if (!drag) return;
  drag.lastX = e.pageX;
  drag.clientY = e.clientY;
  if (!drag.active) {
    if (Math.hypot(e.pageX - drag.x, e.pageY - drag.y) < 5) return;
    drag.active = true;
    document.body.classList.add('dragging');
    getSelection()?.removeAllRanges();
    // Card positions in page coordinates, measured once per drag.
    drag.rects = [...cards].map(([k, c]) => {
      const r = c.getBoundingClientRect();
      return [k, { left: r.left + scrollX, right: r.right + scrollX, top: r.top + scrollY, bottom: r.bottom + scrollY }];
    });
  }
  e.preventDefault();
  updateDrag();
});

// Scroll the page while the pointer is held near the top or bottom edge.
(function autoScroll() {
  if (drag?.active) {
    const top = document.querySelector('header').getBoundingClientRect().bottom;
    const edge = 60;
    let dy = 0;
    if (drag.clientY < top + edge) dy = -Math.ceil((top + edge - drag.clientY) / 3);
    else if (drag.clientY > innerHeight - edge) dy = Math.ceil((drag.clientY - innerHeight + edge) / 3);
    if (dy) { scrollBy(0, dy); updateDrag(); }
  }
  requestAnimationFrame(autoScroll);
})();

document.addEventListener('mouseup', () => {
  if (!drag) return;
  if (drag.active) {
    marquee.style.display = 'none';
    document.body.classList.remove('dragging');
    // The click that follows a drag must not approve a card or clear the selection.
    justDragged = true;
    setTimeout(() => (justDragged = false));
  }
  drag = null;
});

// Plain click on empty space clears the selection.
document.addEventListener('click', (e) => {
  if (justDragged || e.target.closest('.card, header, #bar') || e.shiftKey || e.metaKey) return;
  setSelection(new Set());
});

document.getElementById('filters').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  filter = b.dataset.f;
  for (const x of e.currentTarget.children) x.classList.toggle('on', x === b);
  render();
});
q.addEventListener('input', render);

fetch('/api/state').then((r) => r.json()).then((data) => {
  for (const s of Object.values(data)) s.approved = new Set(s.approved);
  sets = data;
  render();
});
</script>
</body>
</html>
